<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost 文档搜索</title>
<style>
  :root{
    --accent:#4e6ef2;
    --accent-dark:#3a57d8;
    --accent-soft:#eef2ff;
    --bg:#f6f8fc;
    --card:#ffffff;
    --text:#1e2330;
    --muted:#6b7280;
    --line:#e9edf5;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.18);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 460px at 50% -300px, #dfe6ff 0%, rgba(223,230,255,0) 72%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  /* 单屏布局：整页不滚动，只有结果区内部滚动 */
  .app{
    height:100%;
    max-width:900px;
    margin:0 auto;
    padding:28px 20px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---------- 顶部品牌 ---------- */
  .brand{ display:flex; align-items:center; gap:10px; padding-left:4px; }
  .logo{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,#6d8bff,#4e6ef2 60%,#3a57d8);
    box-shadow:0 4px 12px -4px rgba(78,110,242,.7);
    display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px;
  }
  .brand h1{ font-size:16px; font-weight:600; margin:0; letter-spacing:.2px; }
  .brand .tag{
    font-size:11px; color:var(--accent); background:var(--accent-soft);
    border:1px solid #dbe3ff; padding:2px 7px; border-radius:999px;
  }

  /* ---------- 搜索栏 ---------- */
  .searchbar{
    display:flex; align-items:center; gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px 6px 6px 14px;
    box-shadow:var(--shadow);
    transition:border-color .16s ease, box-shadow .16s ease;
  }
  .searchbar:focus-within{
    border-color:#c3cdfb;
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px -14px rgba(78,110,242,.55);
  }
  .searchbar .icon{ flex:none; color:#9aa3b8; display:grid; place-items:center; }
  #q{
    flex:1 1 auto; min-width:0;
    border:0; outline:0; background:transparent;
    font-size:15px; color:var(--text);
    padding:10px 2px;
    font-family:inherit;
  }
  #q::placeholder{ color:#a7aec1; }
  #go{
    flex:none;
    border:0; cursor:pointer;
    background:linear-gradient(180deg,#5b78ff,#4e6ef2);
    color:#fff; font-size:14px; font-weight:600; font-family:inherit;
    padding:10px 20px; border-radius:10px;
    box-shadow:0 6px 14px -8px rgba(78,110,242,.95);
    transition:transform .12s ease, filter .16s ease;
  }
  #go:hover{ filter:brightness(1.05); }
  #go:active{ transform:translateY(1px); }
  #go[disabled]{ opacity:.6; cursor:default; }

  /* ---------- 状态行 ---------- */
  .status{
    display:flex; align-items:center; justify-content:space-between;
    min-height:18px; padding:0 6px;
    font-size:12px; color:var(--muted);
  }
  .status .hint{ opacity:.85; }

  /* ---------- 结果区（唯一滚动容器） ---------- */
  .results{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:2px 6px 8px;
    scrollbar-width:thin;
    scrollbar-color:#cbd3e6 transparent;
  }
  .results::-webkit-scrollbar{ width:8px; }
  .results::-webkit-scrollbar-thumb{ background:#cbd3e6; border-radius:99px; }
  .results::-webkit-scrollbar-track{ background:transparent; }

  .item{
    padding:14px 16px; margin-bottom:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 1px 2px rgba(16,24,40,.03);
    transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  .item:hover{
    border-color:#cdd7fb;
    box-shadow:0 10px 26px -16px rgba(78,110,242,.5);
    transform:translateY(-1px);
  }
  .item a.title{
    display:block; font-size:15.5px; font-weight:600; color:var(--accent-dark);
    text-decoration:none; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .item a.title:hover{ text-decoration:underline; }
  .item p.desc{
    margin:6px 0 0; font-size:13px; color:#4b5563; line-height:1.65;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .item .meta{
    margin-top:8px; display:flex; align-items:center; gap:8px;
    font-size:11.5px; color:#98a1b5;
    overflow:hidden; white-space:nowrap;
  }
  .item .meta .dot{ width:3px; height:3px; border-radius:50%; background:#c8cfdd; flex:none; }

  /* ---------- 空态 / 加载 ---------- */
  .state{
    height:100%; min-height:220px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--muted); text-align:center;
  }
  .state .big{ font-size:15px; color:#4b5563; font-weight:500; }
  .state .small{ font-size:12.5px; color:#98a1b5; }
  .state .glyph{
    width:46px; height:46px; border-radius:14px;
    background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; margin-bottom:2px;
  }
  .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2.5px solid #dbe2f7; border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- 页脚 ---------- */
  .footer{
    flex:none; padding:2px 6px 4px;
    font-size:11px; color:#a9b0c2;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .footer kbd{
    font-family:inherit; font-size:10.5px;
    background:#eef1f8; border:1px solid #e2e7f2; border-bottom-width:2px;
    border-radius:5px; padding:1px 5px; color:#6b7280;
  }

  @media (max-width:560px){
    .app{ padding:18px 12px 8px; gap:11px; }
    .brand h1{ font-size:15px; }
    #go{ padding:10px 14px; }
    .footer{ font-size:10px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="logo">B</div>
    <h1>Boost 文档搜索</h1>
    <span class="tag">自研 HTTP 服务</span>
  </div>

  <div class="searchbar">
    <span class="icon" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
      </svg>
    </span>
    <input id="q" type="text" placeholder="请输入搜索关键字" autocomplete="off" spellcheck="false" autofocus>
    <button id="go">搜索一下</button>
  </div>

  <div class="status">
    <span id="summary">输入关键词后回车，或点击「搜索一下」</span>
    <span class="hint">共 8,563 篇 Boost 文档</span>
  </div>

  <div class="results" id="results">
    <div class="state">
      <div class="glyph">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
        </svg>
      </div>
      <div class="big">试试搜索 asio、container 或 circular_buffer</div>
      <div class="small">语料是 Boost 官方英文文档，请用英文关键词</div>
    </div>
  </div>

  <div class="footer">
    <span>epoll + Reactor · 正排/倒排索引 · cppjieba 分词</span>
    <span><kbd>Enter</kbd> 搜索 &nbsp;·&nbsp; <kbd>Esc</kbd> 清空</span>
  </div>
</div>

<script>
(function () {
  const q = document.getElementById('q');
  const go = document.getElementById('go');
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  let busy = false;

  // 点进输入框即全选：输入任意字符会直接覆盖原有内容
  q.addEventListener('focus', function () { if (q.value) q.select(); });
  q.addEventListener('click', function () { if (q.value) q.select(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Escape') { q.value = ''; showIdle(); }
  });
  go.addEventListener('click', run);

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 语料是从 HTML 里抽出来的，正文里带 &lt; &amp; 之类实体，显示前先还原成字符，避免满屏 &lt;&gt;
  function decodeEntities(s) {
    return String(s == null ? '' : s)
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&');
  }

  const idleHTML =
    '<div class="state">' +
      '<div class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg></div>' +
      '<div class="big">试试搜索 asio、container 或 circular_buffer</div>' +
      '<div class="small">语料是 Boost 官方英文文档，请用英文关键词</div>' +
    '</div>';

  function showIdle() {
    results.innerHTML = idleHTML;
    summary.textContent = '输入关键词后回车，或点击「搜索一下」';
  }

  function showLoading(word) {
    results.innerHTML =
      '<div class="state"><div class="spinner"></div><div class="small">正在检索「' + esc(word) + '」…</div></div>';
    summary.textContent = '检索中…';
  }

  function showEmpty(word) {
    results.innerHTML =
      '<div class="state">' +
        '<div class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5"></path><circle cx="12" cy="16.5" r=".6" fill="currentColor"></circle></svg></div>' +
        '<div class="big">没有找到与「' + esc(word) + '」相关的文档</div>' +
        '<div class="small">换个关键词试试：asio、mutex、regex、circular_buffer（文档是英文，中文关键词通常无结果）</div>' +
      '</div>';
    summary.textContent = '共 0 条结果';
  }

  function showError(msg) {
    results.innerHTML =
      '<div class="state">' +
        '<div class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5"></path><circle cx="12" cy="16.5" r=".6" fill="currentColor"></circle></svg></div>' +
        '<div class="big">请求失败</div><div class="small">' + esc(msg) + '</div>' +
      '</div>';
    summary.textContent = '请求失败';
  }

  function render(list, word, ms) {
    results.innerHTML = list.map(function (it) {      const url = esc(it.url);
      return '<div class="item">' +
        '<a class="title" href="' + url + '" target="_blank" rel="noopener" title="' + url + '">' + esc(it.title) + '</a>' +
        '<p class="desc">' + esc(decodeEntities(it.desc)) + '</p>' +
        '<div class="meta">' +
          '<span>#' + esc(it.id) + '</span><span class="dot"></span>' +
          '<span>词频 ' + esc(it.weight) + '</span><span class="dot"></span>' +
          '<span>' + url.replace(/^https?:\/\//, '').slice(0, 70) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
    results.scrollTop = 0;
    summary.textContent = '共 ' + list.length + ' 条结果' +
      (list.length >= MAX_SHOW ? '（按相关性排序，最多返回 ' + MAX_SHOW + ' 条）' : '') +
      '，用时 ' + ms + ' ms';
  }

  const MAX_SHOW = 100;   // 与后端 MAX_RETURN 保持一致

  // 单次请求；大响应偶尔会被中间链路中断，失败后由下面自动重试一次
  function attempt(word) {
    return fetch('/s?word=' + encodeURIComponent(word), { headers: { 'Accept': 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function run() {
    const word = q.value.trim();
    if (!word) { showIdle(); q.focus(); return; }
    if (busy) return;
    busy = true;
    go.disabled = true;
    showLoading(word);

    const t0 = performance.now();
    attempt(word)
      .catch(function () { return attempt(word); })
      .then(function (data) {
        const ms = Math.round(performance.now() - t0);
        const list = Array.isArray(data) ? data : [];
        if (!list.length) showEmpty(word); else render(list, word, ms);
        try { history.replaceState(null, '', '?word=' + encodeURIComponent(word)); } catch (e) {}
      })
      .catch(function (err) { showError(err && err.message ? err.message : '网络异常'); })
      .finally(function () { busy = false; go.disabled = false; });
  }

  const preset = new URLSearchParams(location.search).get('word');
  if (preset) { q.value = preset; run(); }
})();
</script>
</body>
</html>
